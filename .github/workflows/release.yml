name: Release

# Pousser un tag vX.Y.Z crée une release GitHub avec le zip de l'extension.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier que le tag correspond au manifest
        run: |
          V=$(jq -r .version manifest.json)
          [ "v$V" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME ≠ manifest v$V"; exit 1; }

      - name: Construire le zip
        run: |
          mkdir dist
          zip -r "dist/comment-me-$GITHUB_REF_NAME.zip" manifest.json *.js *.html *.css icons LICENSE

      - name: Publier la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip \
            --title "Comment Me $GITHUB_REF_NAME" \
            --notes "Télécharge **comment-me-$GITHUB_REF_NAME.zip** ci-dessous, puis suis le guide d'installation : https://github.com/$GITHUB_REPOSITORY#installation"
